<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo">Doit</span>
    <div class="projects" id="projects"></div>
  </header>
  <div id="modal"></div>
  <div class="panes-wrap">
    <div class="panes" id="panes"></div>
    <div class="gutter" data-gutter="left" role="separator" aria-orientation="vertical" aria-label="Resize the epics column" tabindex="0" title="Drag to resize. Double-click to reset."></div>
    <div class="gutter" data-gutter="right" role="separator" aria-orientation="vertical" aria-label="Resize the detail column" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
